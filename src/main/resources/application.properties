spring.datasource.url=jdbc:postgresql://localhost:5432/talentsearchdb
spring.datasource.username=postgres
spring.datasource.password=postgres123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Frontend calls http://localhost:9095 everywhere in your JSX files,
# so the server port must be 9095.
server.port=9095

# ---- Email (SMTP) configuration ----
# Use a Gmail "App Password" here, NOT your real Gmail login password.
# 1. Turn on 2-Step Verification: https://myaccount.google.com/security
# 2. Generate an App Password: https://myaccount.google.com/apppasswords
# 3. Paste the 16-character code below (no spaces, all lowercase letters)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ankarthik.531@gmail.com
spring.mail.password=REPLACE_WITH_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Sender display name used in OTP emails
app.mail.from-name=TalentSearch Portal

# OTP expiry, in minutes
app.otp.expiry-minutes=5